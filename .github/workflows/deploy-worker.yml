# Manual one-click deploy of worker.js to Cloudflare from GitHub.
# One-time setup: repo Settings -> Secrets and variables -> Actions ->
# add CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID if your token
# spans accounts). Then: Actions tab -> "deploy worker" -> Run workflow.
name: deploy worker
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
